name: Refresh election report
on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'

permissions:
  contents: write

concurrency:
  group: refresh-election-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Refresh report
        id: refresh
        continue-on-error: true
        run: python refresh.py
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 2028 state election report'
            git push
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: election-report
          path: |
            report/index.html
            report/overview.csv
            report/contests.csv
      - name: Flag a source failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1
